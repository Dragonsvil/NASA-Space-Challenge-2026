<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbi v3 — AI assistant (Planetary Analog Finder)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= DEMO PAGE ONLY (stand-in for the real site) ================= */
  body { margin: 0; min-height: 100vh; font-family: "IBM Plex Sans", system-ui, sans-serif; color: #fff;
         background: radial-gradient(ellipse at 70% 30%, #0e2a63 0%, #041029 55%, #020816 100%); }
  .demo-intro { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 8vw;
                background: linear-gradient(90deg, rgba(4,16,41,.96) 0%, rgba(4,16,41,.75) 45%, rgba(4,16,41,.2) 100%); z-index: 50; transition: opacity .5s; }
  .demo-intro.gone { opacity: 0; pointer-events: none; }
  .demo-intro h1 { font-size: clamp(32px, 5vw, 64px); line-height: 1.05; margin: 0 0 18px; max-width: 760px; }
  .demo-intro h1 em { font-style: normal; color: #ffb3a6; }
  .demo-intro button { align-self: flex-start; background: #FC3D21; color: #fff; border: 0; border-radius: 6px; padding: 14px 22px;
                       font: 600 16px "IBM Plex Sans", system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(252,61,33,.35); }
  .demo-map { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.35); font: 500 14px "IBM Plex Mono", ui-monospace, monospace; }
  .demo-map .sites { display: flex; gap: 12px; margin-top: 16px; }
  .demo-map .sites button { background: rgba(11,61,145,.5); color: #fff; border: 1px solid rgba(255,255,255,.2); padding: 8px 12px; border-radius: 6px; cursor: pointer; font: 500 13px "IBM Plex Sans", system-ui, sans-serif; }

  /* ===================== ORBI (copy into css/orbi.css) ===================== */
  :root {
    --orbi-blue: #0B3D91; --orbi-red: #FC3D21; --orbi-ink: #16123A;
    --orbi-surface: rgba(6, 20, 52, .9); --orbi-line: rgba(255,255,255,.12); --orbi-muted: rgba(255,255,255,.62);
  }
  #orbi-root, #orbi-root * { box-sizing: border-box; }
  #orbi-root { font-family: "IBM Plex Sans", system-ui, sans-serif; }

  /* the character */
  #orbi-char { position: fixed; left: 14px; bottom: 6px; width: 140px; z-index: 9998; pointer-events: none;
               transform-origin: 30% 100%; transform: scale(0) translateY(40px); opacity: 0;
               transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .25s; }
  #orbi-char.in { transform: none; opacity: 1; pointer-events: auto; }
  #orbi-char svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  #orbi-char .rig { transform-box: view-box; transform-origin: 100px 205px; animation: orbi-bob 2.8s ease-in-out infinite; }
  @keyframes orbi-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  #orbi-char .head { transform-box: view-box; transform-origin: 100px 140px; transition: transform .35s ease-out; }
  #orbi-char .ant-l { transform-box: view-box; transform-origin: 80px 36px; animation: orbi-ant 2.6s ease-in-out infinite; }
  #orbi-char .ant-r { transform-box: view-box; transform-origin: 120px 36px; animation: orbi-ant 2.6s ease-in-out infinite reverse; }
  @keyframes orbi-ant { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
  #orbi-char.thinking .ant-l, #orbi-char.thinking .ant-r { animation-duration: .5s; }
  #orbi-char .eye { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  #orbi-char .shine { transition: transform .15s ease-out; }
  #orbi-char.blink .eye { transform: scaleY(.12); }
  #orbi-char .arm-r { transform-box: view-box; transform-origin: 131px 152px; transition: transform .3s; }
  #orbi-char.wave .arm-r { animation: orbi-wave .4s ease-in-out 4; }
  @keyframes orbi-wave { 0%,100% { transform: rotate(-115deg) } 50% { transform: rotate(-140deg) } }
  #orbi-char.thinking .arm-r { transform: rotate(-80deg); }
  #orbi-char .glow { animation: orbi-glowp 1.8s ease-in-out infinite; }
  #orbi-char.thinking .glow { animation-duration: .4s; }
  @keyframes orbi-glowp { 0%,100% { opacity: .45 } 50% { opacity: .95 } }
  #orbi-char.hop .rig { animation: orbi-hop .6s cubic-bezier(.3,.7,.4,1); }
  @keyframes orbi-hop { 0% { transform: scale(1,1) } 20% { transform: translateY(3px) scale(1.08,.9) } 50% { transform: translateY(-26px) scale(.95,1.06) } 80% { transform: translateY(0) scale(1.05,.95) } 100% { transform: none } }

  /* speech bubble (greeting) */
  #orbi-bubble { position: fixed; left: 150px; bottom: 150px; max-width: 300px; z-index: 9999;
                 background: var(--orbi-surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                 border: 1px solid var(--orbi-line); border-radius: 14px 14px 14px 4px; padding: 12px 14px;
                 font-size: 14.5px; line-height: 1.45; color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.45);
                 opacity: 0; transform: translateY(8px) scale(.96); transform-origin: 0 100%; pointer-events: none;
                 transition: opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1); }
  #orbi-bubble.show { opacity: 1; transform: none; }
  #orbi-bubble .who, .orbi-msg .who { display: block; font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: .1em; color: var(--orbi-red); margin-bottom: 3px; }

  /* launcher button */
  #orbi-fab { position: fixed; left: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; z-index: 9999;
              border: 1px solid rgba(255,255,255,.18); background: var(--orbi-surface); backdrop-filter: blur(10px);
              box-shadow: 0 8px 24px rgba(0,0,0,.45); cursor: pointer; display: grid; place-items: center; padding: 0;
              transform: scale(0); transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  #orbi-fab.show { transform: scale(1); }
  #orbi-fab:not(.show) { pointer-events: none; }
  #orbi-fab.show:hover { transform: scale(1.07); }
  #orbi-fab svg { width: 46px; height: 46px; }
  #orbi-fab::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--orbi-red); opacity: 0; }
  #orbi-fab.pulse::after { animation: orbi-ring 1.6s ease-out 3; }
  @keyframes orbi-ring { 0% { opacity: .9; transform: scale(.9) } 100% { opacity: 0; transform: scale(1.35) } }
  #orbi-fab .tip { position: absolute; left: 68px; white-space: nowrap; background: var(--orbi-surface); border: 1px solid var(--orbi-line);
                   color: #fff; font: 500 12.5px "IBM Plex Sans", system-ui, sans-serif; padding: 6px 10px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #orbi-fab:hover .tip { opacity: 1; }

  /* chat panel */
  #orbi-chat { position: fixed; left: 160px; bottom: 22px; width: 370px; max-height: min(560px, 70vh); z-index: 9999;
               display: flex; flex-direction: column; background: var(--orbi-surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
               border: 1px solid var(--orbi-line); border-radius: 14px; box-shadow: 0 18px 48px rgba(0,0,0,.5);
               opacity: 0; transform: translateY(12px) scale(.97); transform-origin: 0 100%; pointer-events: none;
               transition: opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1); }
  #orbi-chat.show { opacity: 1; transform: none; pointer-events: auto; }
  .orbi-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--orbi-line); }
  .orbi-head .title { flex: 1; }
  .orbi-head .title b { display: block; font: 600 14px "IBM Plex Sans", system-ui, sans-serif; }
  .orbi-head .title span { font: 500 10.5px "IBM Plex Mono", monospace; letter-spacing: .08em; color: var(--orbi-muted); text-transform: uppercase; }
  .orbi-head .dot { width: 8px; height: 8px; border-radius: 50%; background: #5ee07a; box-shadow: 0 0 8px #5ee07a; }
  .orbi-icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--orbi-line); background: rgba(255,255,255,.04);
                   color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .orbi-icon-btn:hover { background: rgba(255,255,255,.1); }
  .orbi-icon-btn svg { width: 15px; height: 15px; }
  .orbi-icon-btn.muted { color: var(--orbi-red); border-color: rgba(252,61,33,.5); }
  .orbi-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .orbi-msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .orbi-msg.bot { align-self: flex-start; background: rgba(255,255,255,.06); border: 1px solid var(--orbi-line); border-bottom-left-radius: 4px; }
  .orbi-msg.user { align-self: flex-end; background: var(--orbi-blue); border: 1px solid rgba(255,255,255,.15); border-bottom-right-radius: 4px; }
  .orbi-msg .act { display: inline-block; margin-top: 8px; background: none; border: 1px solid rgba(252,61,33,.6); color: #ffb3a6;
                   font: 600 12px "IBM Plex Sans", system-ui, sans-serif; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .orbi-msg .act:hover { background: rgba(252,61,33,.15); }
  .orbi-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .orbi-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--orbi-muted); animation: orbi-dots 1s infinite; }
  .orbi-typing i:nth-child(2) { animation-delay: .15s } .orbi-typing i:nth-child(3) { animation-delay: .3s }
  @keyframes orbi-dots { 0%,60%,100% { transform: translateY(0); opacity: .5 } 30% { transform: translateY(-4px); opacity: 1 } }
  .orbi-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  .orbi-chips button { background: rgba(255,255,255,.05); border: 1px solid var(--orbi-line); color: #fff; font: 500 12px "IBM Plex Sans", system-ui, sans-serif;
                       padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  .orbi-chips button:hover { border-color: rgba(252,61,33,.6); }
  .orbi-form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--orbi-line); }
  .orbi-form input { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid var(--orbi-line); border-radius: 8px;
                     color: #fff; font: 400 14px "IBM Plex Sans", system-ui, sans-serif; padding: 10px 12px; outline: none; }
  .orbi-form input:focus { border-color: rgba(255,255,255,.35); }
  .orbi-form input::placeholder { color: var(--orbi-muted); }
  .orbi-form button { background: var(--orbi-red); border: 0; border-radius: 8px; width: 42px; color: #fff; cursor: pointer; display: grid; place-items: center; }
  .orbi-form button:disabled { opacity: .45; cursor: default; }
  .orbi-form svg { width: 17px; height: 17px; }

  @media (max-width: 640px) {
    #orbi-char { width: 96px; }
    #orbi-bubble { left: 96px; bottom: 100px; max-width: calc(100vw - 110px); font-size: 13.5px; }
    #orbi-chat { left: 8px; right: 8px; width: auto; bottom: 8px; max-height: 62vh; }
    #orbi-root.open #orbi-char { bottom: calc(62vh + 8px); width: 72px; }
  }
  @media (prefers-reduced-motion: reduce) { #orbi-char .rig, #orbi-char .ant-l, #orbi-char .ant-r { animation: none !important; } }
</style>
</head>

<script>
/* =========================================================================
   ORBI v3 — AI assistant mascot (copy into js/orbi.js). No libraries.

   Flow: Orbi.greet() (call it on "Explore the map") -> greeting -> docks into
   the bottom-left button -> click it -> Orbi pops up, chat opens.

   API:
     Orbi.greet()                     show the greeting, then dock
     Orbi.open() / Orbi.close()       open / close the chat
     Orbi.setData(results)            give him results.json (for data answers)
     Orbi.setContext({target, profile, site})   current selection in the UI
     Orbi.onShowSite = (site) => {}   called by "Show on map" buttons
     Orbi.config.llmEndpoint = "https://..."  optional: real LLM backend.
        POST {question, context} -> {answer}. If unset or failing, Orbi
        answers with his built-in knowledge + the data.
   ========================================================================= */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const root = $('#orbi-root'), char = $('#orbi-char'), bubble = $('#orbi-bubble'), fab = $('#orbi-fab');
  const chat = $('#orbi-chat'), log = $('.orbi-log', chat), chips = $('.orbi-chips', chat);
  const form = $('.orbi-form', chat), input = $('input', form), sendBtn = $('button', form);
  const head = $('.head', char), shines = char.querySelectorAll('.shine'), smile = $('.smile', char), mouth = $('.mouth', char), mo = $('.mo', char);
  const muteBtn = $('[data-act=mute]', chat);

  const config = { llmEndpoint: null, typeSpeed: 22 };
  let data = null, ctx = { target: 'jezero', profile: 'rover', site: null };
  let state = 'hidden';   // hidden | greeting | docked | open
  let busy = false;

  /* ---------- settings ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('orbi.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('orbi.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let muted = store.get('muted', false);
  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function refreshMute() { muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON; muteBtn.classList.toggle('muted', muted); muteBtn.title = muted ? 'Unmute Orbi' : 'Mute Orbi'; }

  /* ---------- sound: alien babble ---------- */
  let ac = null;
  function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
  const FORMANT = { a: 900, e: 1700, i: 2300, o: 600, u: 450, y: 2000 };
  function syllable(ch, vowel) {
    if (muted) return;
    try {
      const a = audio(), t = a.currentTime, d = .1, base = 360 + ((ch.toLowerCase().charCodeAt(0) * 53) % 260);
      const o1 = a.createOscillator(), o2 = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain();
      const f = a.createBiquadFilter(), g = a.createGain();
      o1.type = 'sawtooth'; o2.type = 'triangle';
      o1.frequency.setValueAtTime(base, t); o2.frequency.setValueAtTime(base * 1.5, t);
      const glide = Math.random() < .5 ? 1.35 : .75;
      o1.frequency.exponentialRampToValueAtTime(base * glide, t + d); o2.frequency.exponentialRampToValueAtTime(base * 1.5 * glide, t + d);
      lfo.frequency.value = 34; lg.gain.value = 22; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
      f.type = 'bandpass'; f.Q.value = 4; f.frequency.value = FORMANT[vowel] || 1200;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.13, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(a.destination);
      [o1, o2, lfo].forEach(o => { o.start(t); o.stop(t + d + .02); });
    } catch (e) {}
  }
  function blip(up) {
    if (muted) return;
    try {
      const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.frequency.setValueAtTime(up ? 300 : 1100, t); o.frequency.exponentialRampToValueAtTime(up ? 1300 : 260, t + .25);
      g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .3);
    } catch (e) {}
  }

  /* ---------- character animation ---------- */
  function flash(cls, ms) { char.classList.remove(cls); void char.offsetWidth; char.classList.add(cls); setTimeout(() => char.classList.remove(cls), ms); }
  (function blinkLoop() { setTimeout(() => { flash('blink', 130); blinkLoop(); }, 2500 + Math.random() * 2500); })();
  function setMouth(open, ch) {
    smile.style.display = open ? 'none' : ''; mouth.style.display = open ? '' : 'none';
    if (open) { const v = /[aeiouy]/i.test(ch); mo.setAttribute('ry', v ? 6 : 3); mo.setAttribute('rx', /[ou]/i.test(ch) ? 4.5 : 6.5); }
  }
  document.addEventListener('pointermove', e => {
    if (!char.classList.contains('in')) return;
    const r = char.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .35;
    let dx = (e.clientX - cx) / 200, dy = (e.clientY - cy) / 200; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    shines.forEach(el => el.setAttribute('transform', `translate(${(dx * 4).toFixed(1)} ${(dy * 3.5).toFixed(1)})`));
    head.style.transform = `rotate(${(dx * 5).toFixed(1)}deg)`;
  });
  function showChar(on) { char.classList.toggle('in', on); }

  /* ---------- typewriter into any element ---------- */
  function typeInto(el, text, done) {
    let i = 0, vowel = 'a';
    const timer = setInterval(() => {
      const ch = text[i]; el.textContent += ch;
      if (/[aeiouy]/i.test(ch)) vowel = ch.toLowerCase();
      if (/[a-z]/i.test(ch) && i % 3 === 0) syllable(ch, vowel);
      setMouth(/[a-z]/i.test(ch), ch);
      if (log.contains(el)) log.scrollTop = log.scrollHeight;
      if (++i >= text.length) { clearInterval(timer); setMouth(false); done && done(); }
    }, config.typeSpeed);
    return () => { clearInterval(timer); el.textContent = text; setMouth(false); done && done(); };
  }

  /* ---------- greeting -> dock ---------- */
  let greetTimer = null;
  function greet() {
    if (state !== 'hidden') return;
    state = 'greeting'; audio(); blip(true);
    showChar(true);
    setTimeout(() => { flash('wave', 1700); }, 350);
    setTimeout(() => {
      const txt = $('.txt', bubble); txt.textContent = ''; bubble.classList.add('show');
      typeInto(txt, "Hi, Earthling! I'm Orbi, your AI assistant. Feel free to ask me anything about this map: I'll be right here in the corner.",
        () => { greetTimer = setTimeout(dock, 3200); });
    }, 500);
  }
  function dock() {
    clearTimeout(greetTimer);
    bubble.classList.remove('show'); chat.classList.remove('show'); root.classList.remove('open');
    showChar(false);
    setTimeout(() => { fab.classList.add('show'); if (state === 'greeting') fab.classList.add('pulse'); state = 'docked'; }, 300);
  }

  /* ---------- open / close the chat ---------- */
  function open() {
    if (state === 'open') return;
    clearTimeout(greetTimer); bubble.classList.remove('show');
    audio(); blip(true);
    fab.classList.remove('show', 'pulse');
    state = 'open'; root.classList.add('open');
    showChar(true); flash('hop', 600);
    setTimeout(() => {
      chat.classList.add('show');
      renderChips();
      if (!log.children.length) botSay("What do you need? Ask me about the best sites, hidden gems, how the scores work, or anything about the Moon and Mars.");
      else botSay(pick(["What else do you need?", "I'm back! What's your question?", "Ask away, Earthling."]));
      setTimeout(() => input.focus(), 200);
    }, 250);
  }
  function close() { if (state !== 'open') return; blip(false); dock(); }
  fab.addEventListener('click', open);
  chat.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'close') close();
    if (b.dataset.act === 'mute') { muted = !muted; store.set('muted', muted); refreshMute(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'open') close(); });

  /* ---------- chat log ---------- */
  function addMsg(who, text) {
    const m = document.createElement('div'); m.className = 'orbi-msg ' + who;
    if (who === 'bot') { const w = document.createElement('span'); w.className = 'who'; w.textContent = 'ORBI'; m.appendChild(w); }
    const t = document.createElement('span'); t.className = 'body'; if (text) t.textContent = text; m.appendChild(t);
    log.appendChild(m); log.scrollTop = log.scrollHeight; return m;
  }
  function botSay(text, action) {
    const m = addMsg('bot', ''), body = $('.body', m);
    typeInto(body, text, () => {
      if (action && typeof Orbi.onShowSite === 'function') {
        const b = document.createElement('button'); b.className = 'act'; b.textContent = action.label;
        b.addEventListener('click', () => Orbi.onShowSite(action.site)); m.appendChild(b); log.scrollTop = log.scrollHeight;
      }
    });
  }
  function typingIndicator() {
    const m = addMsg('bot', ''); const d = document.createElement('span'); d.className = 'orbi-typing'; d.innerHTML = '<i></i><i></i><i></i>';
    $('.body', m).appendChild(d); return m;
  }

  /* ---------- asking ---------- */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = input.value.trim(); if (!q || busy) return;
    input.value = ''; busy = true; sendBtn.disabled = true;
    addMsg('user', q);
    char.classList.add('thinking');
    const dots = typingIndicator();
    const started = Date.now();
    let reply;
    try { reply = await answer(q); } catch (err) { reply = { text: "Oops, my antenna lost the signal. Try again?" }; }
    await new Promise(r => setTimeout(r, Math.max(0, 650 - (Date.now() - started))));
    dots.remove(); char.classList.remove('thinking');
    botSay(reply.text, reply.action);
    busy = false; sendBtn.disabled = false; input.focus();
  });
  function renderChips() {
    chips.innerHTML = '';
    const list = ["What is this project?", "Best site for Mars?", "What's a hidden gem?", "Where does the analogy break?"];
    if (ctx.site) list.unshift("Tell me about this site");
    list.slice(0, 4).forEach(q => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = q;
      b.addEventListener('click', () => { input.value = q; form.requestSubmit(); });
      chips.appendChild(b);
    });
  }

  /* =======================================================================
     THE BRAIN: data-aware answers first, then optional LLM, then FAQ.
     ======================================================================= */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%\s]/g, ' ');
  const has = (q, words) => words.some(w => q.includes(w));
  const TARGET_NAMES = { jezero: 'Jezero Crater (Mars)', lunar_south_pole: 'the lunar south pole' };
  const PROFILE_NAMES = { rover: 'rover navigation', geology: 'geology / science', polar: 'polar & thermal ops' };

  function targetOf(q) { if (has(q, ['mars', 'jezero', 'martian'])) return 'jezero'; if (has(q, ['moon', 'lunar', 'south pole'])) return 'lunar_south_pole'; return ctx.target || 'jezero'; }
  function profileOf(q) { if (has(q, ['rover', 'navigat', 'drive', 'driving', 'wheel'])) return 'rover'; if (has(q, ['geolog', 'science', 'rock', 'mineral'])) return 'geology'; if (has(q, ['polar', 'thermal', 'cold', 'ice', 'temperature'])) return 'polar'; return ctx.profile || 'rover'; }
  function total(site, t, p) { const s = site && site.scores && site.scores[t] && site.scores[t][p]; return s && typeof s.total === 'number' ? s.total : null; }
  function isGem(site, t) { const g = site.hidden_gem; return g === true || (g && typeof g === 'object' && g[t] === true); }
  function where(site) { const r = site.region || 'an unnamed area'; return `${r} (${fmtLat(site.lat)}, ${fmtLon(site.lon)})`; }
  function fmtLat(v) { return typeof v === 'number' ? `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'N' : 'S'}` : '?'; }
  function fmtLon(v) { return typeof v === 'number' ? `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'E' : 'W'}` : '?'; }
  function dimLabel(id) { const d = data && data.meta && (data.meta.dimensions || []).find(x => x.id === id); return d ? d.label.toLowerCase() : id; }
  function ranked(t, p) { return (data && data.sites || []).filter(s => total(s, t, p) !== null).sort((a, b) => total(b, t, p) - total(a, t, p)); }

  function dataAnswer(q) {
    if (!data) return null;
    const t = targetOf(q), p = profileOf(q);

    // about the selected site
    if (has(q, ['this site', 'this place', 'selected', 'this spot', 'here']) && ctx.site) {
      const s = ctx.site, tt = ctx.target, pp = ctx.profile, sc = s.scores && s.scores[tt] && s.scores[tt][pp];
      if (!sc || sc.total == null) return { text: `I don't have enough data to score ${where(s)} for ${PROFILE_NAMES[pp]}.` };
      const dims = Object.entries(sc.dims || {}).filter(([, v]) => typeof v === 'number').sort((a, b) => b[1] - a[1]);
      let txt = `${where(s)} scores ${sc.total}/100 against ${TARGET_NAMES[tt]} for ${PROFILE_NAMES[pp]}.`;
      if (dims.length) txt += ` Its strongest point is ${dimLabel(dims[0][0])} (${dims[0][1]}), its weakest is ${dimLabel(dims[dims.length - 1][0])} (${dims[dims.length - 1][1]}).`;
      if (isGem(s, tt)) txt += " It's one of our hidden gems: very similar to known analog sites, but not studied as one.";
      if (s.known_analog) txt += ` It's also a known analog site: ${s.known_analog}.`;
      txt += ' And like everywhere on Earth: real gravity, thick air and a magnetic field. That part never matches.';
      return { text: txt };
    }

    // hidden gems
    if (has(q, ['gem', 'hidden', 'unknown', 'undiscovered', 'new site', 'unstudied'])) {
      const gems = ranked(t, p).filter(s => isGem(s, t));
      if (!gems.length) return { text: `I don't have hidden gems for ${TARGET_NAMES[t]} in this dataset yet. A hidden gem is a site that scores high and looks like known analogs, but nobody uses it as one.` };
      const top = gems.slice(0, 3).map(s => `${where(s)}: ${total(s, t, p)}/100`).join('\n• ');
      return { text: `${gems.length} hidden gems for ${TARGET_NAMES[t]}. The best for ${PROFILE_NAMES[p]}:\n• ${top}\nThey're very similar to known analogs, but nobody studies them as one. Yet.`,
               action: { label: 'Show the best one on the map', site: gems[0] } };
    }

    // a known analog by name
    for (const a of (data.known_analogs || [])) {
      const key = norm(a.name).split(' ').filter(w => w.length > 3)[0];
      if (key && q.includes(key)) {
        const sc = a.scores && a.scores[t] && a.scores[t][p];
        if (!sc || sc.total == null || sc.global_rank == null) return { text: `${a.name} is a known analog site, but it isn't scored here${a.tile_note ? ': ' + a.tile_note : ''}.` };
        const n = data.meta && data.meta.tiles_scored && data.meta.tiles_scored[t];
        const pct = n ? (sc.global_rank / n * 100) : null;
        const rankTxt = pct == null ? `rank #${sc.global_rank}` : (pct <= 50 ? `top ${pct < 1 ? pct.toFixed(1) : Math.round(pct)}% of Earth's barren land (#${sc.global_rank})` : `in the lower half (#${sc.global_rank} of ${n})`);
        return { text: `${a.name} scores ${sc.total}/100 against ${TARGET_NAMES[t]} for ${PROFILE_NAMES[p]}: ${rankTxt}.${a.used_for ? ' It\'s used for ' + a.used_for + '.' : ''}` };
      }
    }

    // best / top sites
    if (has(q, ['best', 'top', 'highest', 'most similar', 'closest', 'recommend', 'where should', 'good place', 'ideal'])) {
      const list = ranked(t, p);
      if (!list.length) return { text: `I don't have scored sites for ${TARGET_NAMES[t]} yet.` };
      const [a, b, c] = list;
      let txt = `For ${TARGET_NAMES[t]} with the ${PROFILE_NAMES[p]} profile, the best match is ${where(a)}, with ${total(a, t, p)}/100.`;
      if (b) txt += ` Next: ${where(b)} (${total(b, t, p)})${c ? ` and ${where(c)} (${total(c, t, p)})` : ''}.`;
      return { text: txt, action: { label: 'Show it on the map', site: a } };
    }

    // counts
    if (has(q, ['how many', 'number of', 'count'])) {
      const n = data.meta && data.meta.tiles_scored && data.meta.tiles_scored[t];
      return { text: `${n ? `We scored ${n.toLocaleString('en')} tiles of Earth's barren land against ${TARGET_NAMES[t]}. ` : ''}The map shows the ${(data.sites || []).length.toLocaleString('en')} best ones, and ${(data.known_analogs || []).length} known analog sites for comparison.` };
    }

    // validation
    if (has(q, ['validat', 'proof', 'prove', 'trust', 'accurate', 'reliable', 'does it work', 'known analog'])) {
      const n = data.meta && data.meta.tiles_scored && data.meta.tiles_scored[t];
      const body = (t === 'jezero' ? 'mars' : 'moon');
      const list = (data.known_analogs || []).filter(a => norm(a.analog_for || '').includes(body));
      const scored = list.filter(a => a.scores && a.scores[t] && a.scores[t][p] && a.scores[t][p].global_rank != null);
      const good = n ? scored.filter(a => a.scores[t][p].global_rank / n <= .1).length : null;
      if (good == null || !scored.length) return { text: "We check the method on famous analog sites (Atacama, Haughton Crater, Mauna Kea…): if it works, they should rank high. Open the Validation tab to see it." };
      return { text: `We test the method on sites scientists already use. Right now, ${good} of ${scored.length} known ${body === 'mars' ? 'Mars' : 'Moon'} analogs rank in the top 10% of Earth's barren land for ${PROFILE_NAMES[p]}. The Validation tab has the full table.` };
    }
    return null;
  }

  const FAQ = [
    { k: ['hello', 'hi ', 'hey', 'salam', 'bonjour', 'yo '], a: () => pick(["Hello, Earthling! What do you want to know?", "Hi there! Ask me about the map, the scores, or the Moon and Mars."]) },
    { k: ['thank', 'merci', 'shukran'], a: () => pick(["Anytime! Zorp.", "You're welcome, Earthling!"]) },
    { k: ['who are you', 'your name', 'what are you'], a: () => "I'm Orbi, the AI assistant of the Planetary Analog Finder, built by Team FAKERS for the NASA Space Apps Challenge 2026. My hoodie says it all." },
    { k: ['fakers', 'team', 'who made', 'who built', 'creator'], a: () => "Team FAKERS built this for the NASA Space Apps Challenge 2026: 6 people on data, science, design and storytelling. I'm the one with antennae." },
    { k: ['what is this', 'this project', 'what does this', 'what is the project', 'about this', 'purpose', 'explain'], a: () => "We scan the whole Earth to find places that behave like a Moon base site or a Mars landing site. Testing rovers and gear on Earth is cheap; doing it up there is not. So each patch of barren land gets a similarity score, dimension by dimension." },
    { k: ['analog'], a: () => "An analog is a place on Earth that shares some conditions with the Moon or Mars: rocks, terrain, cold, dryness, dust… Teams use them to test instruments and train before flying. No place matches everything, so we show what matches and what doesn't." },
    { k: ['how', 'method', 'score', 'calculat', 'work', 'algorithm', 'machine learning', 'ml'], a: () => "Each 0.25° tile of barren land is compared to the target in real units: temperature range, slope, roughness, albedo, rock type, dryness, dust, sun angle. Each dimension gets a 0–100 score (how close it gets compared to the rest of Earth), and a mission profile weights them into a total. Clustering then spots look-alikes of known analogs." },
    { k: ['data', 'dataset', 'satellite', 'source', 'nasa', 'modis', 'esa'], a: () => "Earth side: NASA MODIS (temperature, albedo, vegetation), GPM (rain), ASTER (rock composition), Copernicus DEM (terrain), aerosol data for dust. Moon and Mars side: LRO (LOLA, Diviner), MOLA and other NASA mission data. The map background is NASA GIBS imagery." },
    { k: ['profile', 'mission', 'rover navigation', 'geology profile', 'polar'], a: () => "Three mission profiles: rover navigation (slopes, roughness, dust), geology / science (rock type, dryness) and polar & thermal ops (cold, low sun). Same data, different priorities." },
    { k: ['break', 'limit', 'differ', 'not similar', 'gravity', 'atmosphere', 'radiation', 'weakness'], a: () => "Earth can never copy three things: gravity (the Moon has about 1/6 of ours, Mars about 38%), the atmosphere (vacuum on the Moon, thin CO2 on Mars) and radiation, since Earth is shielded by its air and magnetic field. Every site card lists these, plus the dimensions where it scores low." },
    { k: ['jezero'], a: () => "Jezero Crater on Mars is an ancient lake with a river delta. The Perseverance rover has been exploring it since 2021, looking for signs of past life." },
    { k: ['south pole', 'lunar', 'moon base', 'artemis'], a: () => "The lunar south pole is where NASA's Artemis program wants to go: some craters there never see sunlight and may hold water ice, while nearby ridges get sunlight most of the time. The sun stays very low on the horizon." },
    { k: ['mars'], a: () => "Mars is cold, dry and dusty, with thin CO2 air and about 38% of Earth's gravity. Our Mars target is Jezero Crater." },
    { k: ['moon'], a: () => "The Moon has no air, extreme temperatures and about 1/6 of Earth's gravity. Our Moon target is the south pole, where future bases are planned." },
    { k: ['use', 'how do i', 'help', 'navigate', 'click'], a: () => "Pick a target (Mars or Moon) and a mission profile at the top, then click any dot on the map: you'll see its score, a radar chart and where the analogy breaks. The Top sites and Validation tabs are in the side panel." },
    { k: ['morocco', 'maroc', 'tissint'], a: () => "Fun fact: a real Martian meteorite, Tissint, fell in Morocco in 2011 near Tata. Morocco also has plenty of dry, rocky desert worth checking on the map." },
    { k: ['joke', 'funny'], a: () => pick(["Why did the alien skip the Moon base party? No atmosphere.", "I tried to park my saucer in the Atacama. Too many rovers."]) }
  ];
  function faqAnswer(q) {
    for (const f of FAQ) if (f.k.some(k => (' ' + q + ' ').includes(k))) return { text: f.a() };
    return null;
  }

  async function llmAnswer(question) {
    if (!config.llmEndpoint) return null;
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 12000);
    try {
      const site = ctx.site ? { region: ctx.site.region, lat: ctx.site.lat, lon: ctx.site.lon, scores: ctx.site.scores && ctx.site.scores[ctx.target] } : null;
      const res = await fetch(config.llmEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ question, context: { target: ctx.target, profile: ctx.profile, site } }) });
      if (!res.ok) return null;
      const j = await res.json(); return j && j.answer ? { text: String(j.answer) } : null;
    } catch (e) { return null; } finally { clearTimeout(to); }
  }

  async function answer(raw) {
    const q = ' ' + norm(raw) + ' ';
    return dataAnswer(q) || faqAnswer(q) || await llmAnswer(raw) || {
      text: "Hmm, that one's beyond my antennae. Try asking about the best sites for Mars or the Moon, hidden gems, how the scores work, or where the analogy breaks."
    };
  }

  /* ---------- public API ---------- */
  refreshMute();
  window.Orbi = {
    config, greet, open, close,
    setData(d) { data = d; },
    setContext(c) { ctx = Object.assign({}, ctx, c); if (state === 'open') renderChips(); },
    say(text) { if (state === 'open') botSay(text); },
    onShowSite: null
  };
})();

/* ---------------- DEMO ONLY ---------------- */
const demoSites = [
  { id: 'a', lat: -23.75, lon: -69.25, region: 'Chile, near San Pedro de Atacama', known_analog: 'Atacama Desert', hidden_gem: { jezero: false },
    scores: { jezero: { rover: { total: 83, dims: { slope: 94, roughness: 90, aridity: 98, albedo: 71, temp_range: 52 } }, geology: { total: 80, dims: {} }, polar: { total: 41, dims: {} } } } },
