<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planetary Analog Finder</title>

  <!-- Leaflet (map library), loaded from a CDN: no build step -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <!-- Fonts: IBM Plex Sans for text, IBM Plex Mono for numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top bar: title + the two segmented controls -->
  <header id="topbar">
    <h1>Planetary Analog Finder</h1>
    <!-- Selected target, e.g. "MARS · JEZERO CRATER" (filled by app.js) -->
    <span id="target-readout"></span>

    <div class="control">
      <span class="control-label" id="target-label">Target</span>
      <!-- filled by app.js from the data -->
      <div class="segmented" id="target-select" role="radiogroup" aria-labelledby="target-label"></div>
    </div>

    <div class="control">
      <span class="control-label" id="profile-label">Mission profile</span>
      <!-- filled by app.js from the data -->
      <div class="segmented" id="profile-select" role="radiogroup" aria-labelledby="profile-label"></div>
    </div>
  </header>

  <main>
    <!-- The world map -->
    <div id="map">
      <!-- Legend, drawn on top of the map (filled by app.js) -->
      <div id="legend"></div>
      <!-- Shown while the data file downloads; removed by app.js when the sites are drawn -->
      <div id="loading" role="status"><span class="spinner"></span>Loading the sites…</div>
    </div>

    <!-- Side panel: three tabs on top, content below (both filled by js/panel.js) -->
    <aside id="panel">
      <div class="segmented tabs" id="panel-tabs" role="radiogroup" aria-label="Panel view"></div>
      <div id="panel-content">
        <!-- Replaced by js/panel.js as soon as the data file is loaded -->
        <p class="placeholder">Loading the sites…</p>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Chart.js (radar chart), loaded from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
